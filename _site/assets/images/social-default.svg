  <line x1="60" y1="80" x2="620" y2="80" stroke="#a07c3a" stroke-width="0.75" style="fill:rgb(0, 0, 0);stroke:rgb(160, 124, 58);color:rgb(0, 0, 0);stroke-width:0.75px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
