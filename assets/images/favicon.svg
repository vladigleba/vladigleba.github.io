<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- background fill -->
  <rect width="100" height="100" rx="12" fill="#faf7f2"/>

  <!-- top rule -->
  <line x1="4" y1="20" x2="96" y2="20" stroke="#a07c3a" stroke-width="2"/>

  <!-- bg -->
  <text x="50" y="70"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-size="60"
    font-weight="700"
    fill="#a07c3a">BG</text>

  <!-- bottom rule -->
  <line x1="4" y1="78" x2="96" y2="78" stroke="#a07c3a" stroke-width="2"/>
</svg>